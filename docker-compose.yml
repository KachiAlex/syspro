# Secrets and environment values live in .env next to this file on the server
# (untracked — see .env.example for the required keys).

services:
  syspro-erp-db:
    image: postgres:17-alpine
    container_name: syspro-erp-db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - syspro_erp_pgdata:/var/lib/postgresql/data
    networks:
      - syspro-erp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  syspro-erp-app:
    image: syspro-erp-app:${APP_IMAGE_TAG:-patched}
    container_name: syspro-erp-app
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "3003:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      SESSION_SECRET: ${SESSION_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      syspro-erp-db:
        condition: service_healthy
    networks:
      - syspro-erp-net

volumes:
  syspro_erp_pgdata:

networks:
  syspro-erp-net:
