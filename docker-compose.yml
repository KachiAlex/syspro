# Secrets and environment values live in .env next to this file on the server
# (untracked — see .env.example for the required keys).

services:
  syspro-erp-db:
    image: postgres:17-alpine
    container_name: syspro-erp-db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
    volumes:
      - syspro_erp_pgdata:/var/lib/postgresql/data
    networks:
      - syspro-erp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgBouncer fronting Postgres in SESSION mode (required — POS uses
  # session-scoped pg_advisory_lock across a dedicated pooled client).
  # The app connects here; migrations/scripts keep using DATABASE_URL
  # (direct to syspro-erp-db) from .env.
  syspro-erp-pool:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: syspro-erp-pool
    restart: unless-stopped
    mem_limit: 128m
    environment:
      DB_HOST: syspro-erp-db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: session
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      LISTEN_PORT: "6432"
      ADMIN_USERS: ${POSTGRES_USER}
      AUTH_TYPE: scram-sha-256
    depends_on:
      syspro-erp-db:
        condition: service_healthy
    networks:
      - syspro-erp-net

  syspro-erp-app:
    image: syspro-erp-app:${APP_IMAGE_TAG:-patched}
    container_name: syspro-erp-app
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "3003:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@syspro-erp-pool:6432/${POSTGRES_DB}
      SQL_SLOW_MS: ${SQL_SLOW_MS:-500}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      SESSION_SECRET: ${SESSION_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      syspro-erp-db:
        condition: service_healthy
      syspro-erp-pool:
        condition: service_started
    networks:
      - syspro-erp-net

volumes:
  syspro_erp_pgdata:

networks:
  # External: shared with pisairtel-nginx (connected manually). Compose must
  # never create/remove it — a managed network teardown here strands nginx.
  syspro-erp-net:
    external: true
    name: syspro-erp_syspro-erp-net
