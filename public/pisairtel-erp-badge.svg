<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pisairtel ERP logo</title>
<desc>Circular badge logo with a gold-to-magenta gradient ring, white inner circle, red pi symbol and sairtel wordmark, and an ERP tag beneath.</desc>
<defs>
<linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#F7C93C"/>
<stop offset="28%" stop-color="#F7931E"/>
<stop offset="55%" stop-color="#E8286E"/>
<stop offset="80%" stop-color="#C0208A"/>
<stop offset="100%" stop-color="#8E1FA0"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="600" height="600" fill="#000000"/>

<circle cx="300" cy="280" r="220" fill="url(#ringGrad)"/>
<circle cx="300" cy="280" r="196" fill="#000000"/>
<circle cx="300" cy="280" r="182" fill="#FFFFFF"/>

<text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="76" font-weight="700" fill="#E31E24">
<tspan font-style="italic">&#960;</tspan><tspan> sairtel</tspan>
</text>

<rect x="205" y="332" width="190" height="52" rx="26" fill="#E31E24"/>
<text x="300" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="3" fill="#FFFFFF">ERP</text>

</svg>
