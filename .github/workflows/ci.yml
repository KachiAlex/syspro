name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: syspro
          POSTGRES_PASSWORD: ci_test_pass
          POSTGRES_DB: syspro_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syspro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://syspro:ci_test_pass@localhost:5432/syspro_erp?sslmode=disable
      SESSION_SECRET: ci-session-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply DB migrations
        run: node scripts/run-migrations.js

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --max-warnings=1000

      - name: Run tests
        run: npm run test:run
